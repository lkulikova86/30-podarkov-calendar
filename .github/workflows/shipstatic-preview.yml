name: ShipStatic preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shipstatic-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static package
        shell: bash
        run: |
          set -e
          rm -rf dist
          mkdir -p dist/gifts
          cp index.html dist/index.html
          cp new_anim_*.webp dist/
          cp -a gifts/. dist/gifts/
      - name: Publish preview to ShipStatic
        id: ship
        uses: shipstatic/action@v2
        with:
          path: ./dist
      - name: Show preview links
        shell: bash
        run: |
          echo "URL=${{ steps.ship.outputs.url }}"
          echo "CLAIM=${{ steps.ship.outputs.claim }}"
