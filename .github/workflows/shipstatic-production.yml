name: Publish birthday calendar

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'new_anim_*.webp'
      - 'gifts/**'
      - '.github/workflows/shipstatic-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static package
        shell: bash
        run: |
          set -e
          rm -rf dist
          mkdir -p dist/gifts
          cp index.html dist/index.html
          cp new_anim_*.webp dist/
          cp -a gifts/. dist/gifts/
          python - <<'PY'
          from pathlib import Path
          import base64

          # Rebuild the original day-3 JPEG from the two text parts.
          # This avoids binary corruption in Git storage/deploy transport.
          p1 = Path('gifts/day3_photo_1.txt').read_text(encoding='utf-8')
          p2 = Path('gifts/day3_photo_2.txt').read_text(encoding='utf-8')
          b64 = (p1 + p2).replace('\n', '').replace('\r', '').replace(' ', '')
          data = base64.b64decode(b64, validate=True)
          if not (data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')):
              raise SystemExit('Day 3 JPEG failed header/footer validation')
          Path('dist/gifts/day3_photo.jpg').write_bytes(data)

          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')
          old = '{date:"2026-08-26", day:"26", month:"AUG", gift:"Подарок №3", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"От человека №3"}'
          new = '{date:"2026-08-26", day:"26", month:"AUG", gift:"Подарок №3", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"любимая жена", image:"gifts/day3_photo.jpg?v=5"}'
          if old not in s:
              raise SystemExit('Day 3 placeholder not found in index.html')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          if len(data) < 100000:
              raise SystemExit('Day 3 JPEG unexpectedly small')
          if 'from:"любимая жена", image:"gifts/day3_photo.jpg?v=5"' not in s:
              raise SystemExit('Day 3 patch verification failed')
          print(f'DAY3_OK: rebuilt JPEG {len(data)} bytes + sender in production build')
          PY
      - name: Publish to permanent ShipStatic address
        uses: shipstatic/action@v2
        with:
          token: ${{ secrets.SHIP_TOKEN }}
          path: ./dist
          domain: 30-podarkov-calendar.shipstatic.com
