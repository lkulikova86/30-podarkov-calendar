name: Publish birthday calendar

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'new_anim_*.webp'
      - 'gifts/**'
      - '.github/workflows/shipstatic-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static package
        shell: bash
        run: |
          set -e
          rm -rf dist
          mkdir -p dist/gifts
          cp index.html dist/index.html
          cp new_anim_*.webp dist/
          cp -a gifts/. dist/gifts/
          python - <<'PY'
          from pathlib import Path
          import base64

          # Day 3: rebuild a normal JPEG file from text-safe base64.
          p1 = Path('gifts/day3_photo_1.txt').read_text(encoding='utf-8')
          p2 = Path('gifts/day3_photo_2.txt').read_text(encoding='utf-8')
          b64 = (p1 + p2).replace('\n', '').replace('\r', '').replace(' ', '')
          data = base64.b64decode(b64, validate=True)
          if not (data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')):
              raise SystemExit('Day 3 JPEG failed validation')
          Path('dist/gifts/day3_photo.jpg').write_bytes(data)

          # Day 4: use the SAME delivery method as day 3: rebuild a normal JPEG
          # during the build, then reference that JPEG from the gift object.
          day4_b64 = Path('gifts/day4_photo_b64.txt').read_text(encoding='utf-8')
          day4_b64 = day4_b64.replace('\n', '').replace('\r', '').replace(' ', '')
          day4_data = base64.b64decode(day4_b64, validate=True)
          if not (day4_data.startswith(b'\xff\xd8') and day4_data.endswith(b'\xff\xd9')):
              raise SystemExit('Day 4 JPEG failed validation')
          Path('dist/gifts/day4_photo.jpg').write_bytes(day4_data)

          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')

          # Make the falling faces denser and much faster.
          if 'const total = 12;' not in s:
              raise SystemExit('Animation count setting not found')
          s = s.replace('const total = 12;', 'const total = 18;', 1)

          if 'const duration = 45 + Math.random() * 25;' not in s:
              raise SystemExit('Animation speed setting not found')
          s = s.replace('const duration = 45 + Math.random() * 25;', 'const duration = 14 + Math.random() * 8;', 1)

          # Keep day 3 data patched into the production build.
          old = '{date:"2026-08-26", day:"26", month:"AUG", gift:"Подарок №3", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"От человека №3"}'
          new = '{date:"2026-08-26", day:"26", month:"AUG", gift:"Подарок №3", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"Любимая жена", image:"gifts/day3_photo.jpg?v=9"}'
          if old not in s:
              raise SystemExit('Day 3 placeholder not found in index.html')
          s = s.replace(old, new, 1)

          # Day 4 is now rendered exactly like day 3: a normal JPEG URL.
          old4 = '{date:"2026-08-27", day:"27", month:"AUG", gift:"Подарок №4", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"От человека №4"}'
          new4 = '{date:"2026-08-27", day:"27", month:"AUG", gift:"Подарок №4", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"Любимая жена", image:"gifts/day4_photo.jpg?v=13"}'
          if old4 not in s:
              raise SystemExit('Day 4 placeholder not found in index.html')
          s = s.replace(old4, new4, 1)

          p.write_text(s, encoding='utf-8')

          if 'const total = 18;' not in s:
              raise SystemExit('Animation count patch verification failed')
          if 'const duration = 14 + Math.random() * 8;' not in s:
              raise SystemExit('Animation speed patch verification failed')
          if 'from:"Любимая жена", image:"gifts/day3_photo.jpg?v=9"' not in s:
              raise SystemExit('Day 3 sender patch verification failed')
          if 'from:"Любимая жена", image:"gifts/day4_photo.jpg?v=13"' not in s:
              raise SystemExit('Day 4 image patch verification failed')
          if not Path('dist/gifts/day4_photo.jpg').exists():
              raise SystemExit('Day 4 JPEG was not written')
          print(f'DEPLOY_OK: 18 falling faces, 14-22s speed, day3 {len(data)} bytes, day4 {len(day4_data)} bytes as normal JPEG')
          PY
      - name: Publish to permanent ShipStatic address
        uses: shipstatic/action@v2
        with:
          token: ${{ secrets.SHIP_TOKEN }}
          path: ./dist
          domain: 30-podarkov-calendar.shipstatic.com
