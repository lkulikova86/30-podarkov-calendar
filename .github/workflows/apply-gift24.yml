name: Apply gift 24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gift24.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch gift 24
        shell: bash
        run: |
          set -e
          cp gifts/day23_photo.jpg gifts/day24_photo.jpg
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '{date:"2026-09-16", day:"16", month:"SEP", gift:"Подарок №24", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"От человека №24"}'
          new = '{date:"2026-09-16", day:"16", month:"SEP", gift:"Подарок №24", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"Любимая жена", image:"gifts/day24_photo.jpg?v=1"}'
          if old not in s:
              raise SystemExit('Gift 24 placeholder not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html gifts/day24_photo.jpg
          git commit -m "Add gift 24 photo" || exit 0
          git push origin HEAD:main
