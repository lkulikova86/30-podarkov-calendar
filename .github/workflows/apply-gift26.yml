name: Apply gift 26

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gift26.yml'
      - 'gifts/day26_photo.jpg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch gift 26
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          m = re.search(r'\{date:"2026-09-18"[^\n]*\}', s)
          if not m:
              raise SystemExit('Gift 26 entry not found')

          old = m.group(0)
          new = re.sub(r'from:"[^"]*"', 'from:"Любимая жена"', old, count=1)
          new = re.sub(r', image:"[^"]*"', '', new, count=1)
          new = new[:-1] + ', image:"gifts/day26_photo.jpg?v=1"}'
          p.write_text(s[:m.start()] + new + s[m.end():], encoding='utf-8')
          print(new)
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add gift 26 photo and sender" || exit 0
          git push origin HEAD:main
