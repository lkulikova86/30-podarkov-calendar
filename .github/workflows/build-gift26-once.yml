name: Build day 3 gift image once

on:
  push:
    paths:
      - '.github/workflows/build-gift26-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild JPEG from stored base64 parts
        run: |
          cat gifts/gift26_part1.txt gifts/gift26_part2.txt gifts/gift26_part3.txt | tr -d '\n\r ' | base64 -d > gifts/gift_2026-08-26.jpg
          file gifts/gift_2026-08-26.jpg
      - name: Commit rebuilt image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gifts/gift_2026-08-26.jpg
          git commit -m "Build valid JPEG for day 3 gift" || exit 0
          git push
