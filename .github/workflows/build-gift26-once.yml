name: Build day 3 gift image once

on:
  push:
    paths:
      - '.github/workflows/build-gift26-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert existing WebP gift image to JPEG
        run: |
          file gifts/gift_2026-08-26.webp
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert gifts/gift_2026-08-26.webp -quality 92 gifts/gift_2026-08-26.jpg
          file gifts/gift_2026-08-26.jpg
      - name: Commit rebuilt image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gifts/gift_2026-08-26.jpg
          git commit -m "Build valid JPEG for day 3 gift"
          git push
