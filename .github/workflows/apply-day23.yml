name: Apply Day 23 Gift

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Stage day 23 gift assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gift 23 entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '  {date:"2026-09-15", day:"15", month:"SEP", gift:"Подарок №23", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"От человека №23"},'
          new = '  {date:"2026-09-15", day:"15", month:"SEP", gift:"Подарок №23", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"Антон и Даша", image:"gifts/day23_photo.jpg?v=1"},'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one gift 23 placeholder, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply day 23 gift update"
          git push
