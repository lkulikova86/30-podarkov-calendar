name: Fix 25 August gift

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-gift:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put 25 August photo directly into the site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, base64

          js_path = Path('gifts/2026-08-25.js')
          index_path = Path('index.html')
          js = js_path.read_text(encoding='utf-8')
          html = index_path.read_text(encoding='utf-8')

          m = re.search(r'g\.image\s*=\s*"data:image/jpeg;base64,([A-Za-z0-9+/=]+)"', js)
          if not m:
              raise SystemExit('Could not find the 25 August JPEG in gift override')

          photo_path = Path('gifts/2026-08-25.jpg')
          photo_path.write_bytes(base64.b64decode(m.group(1)))

          pattern = r'\{date:"2026-08-25", day:"25", month:"AUG", gift:"Подарок №2", note:"[^"]*", from:"[^"]*"(?:, image:[^}]*)?\}'
          replacement = '{date:"2026-08-25", day:"25", month:"AUG", gift:"Подарок №2", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"Любимая жена", image:"gifts/2026-08-25.jpg"}'
          html2, count = re.subn(pattern, replacement, html, count=1)
          if count != 1:
              raise SystemExit(f'Could not patch 25 August gift object, matches={count}')
          index_path.write_text(html2, encoding='utf-8')
          print('Patched 25 August gift and wrote', photo_path)
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html gifts/2026-08-25.jpg
          git commit -m 'Show 25 August gift photo' || exit 0
          git push

# trigger: refresh day 2 photo
