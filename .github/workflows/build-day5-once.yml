name: Build day 5 gift image once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-day5-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build day 5 image and connect it to the calendar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          b64 = Path('gifts/day5_photo_b64.txt').read_text(encoding='utf-8')
          b64 = b64.replace('\n', '').replace('\r', '').replace(' ', '')
          data = base64.b64decode(b64, validate=True)
          if not (data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')):
              raise SystemExit('Day 5 JPEG validation failed')

          photo = Path('gifts/day5_photo.jpg')
          photo.write_bytes(data)

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          old = '{date:"2026-08-28", day:"28", month:"AUG", gift:"Подарок №5", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"От человека №5"}'
          new = '{date:"2026-08-28", day:"28", month:"AUG", gift:"Подарок №5", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"Бабушка", image:"gifts/day5_photo.jpg?v=1"}'

          if old not in html:
              raise SystemExit('Day 5 placeholder not found in index.html')

          html = html.replace(old, new, 1)
          index_path.write_text(html, encoding='utf-8')

          if 'from:"Бабушка", image:"gifts/day5_photo.jpg?v=1"' not in html:
              raise SystemExit('Day 5 patch verification failed')
          print(f'Day 5 ready: {len(data)} JPEG bytes')
          PY
      - name: Commit day 5 gift
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html gifts/day5_photo.jpg
          git commit -m 'Add day 5 gift from Grandma' || exit 0
          git push
