name: Publish current birthday calendar fallback

on:
  workflow_run:
    workflows: ["Publish birthday calendar"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-current:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build current static package
        shell: bash
        run: |
          set -e
          rm -rf dist
          mkdir -p dist/gifts
          cp index.html dist/index.html
          cp new_anim_*.webp dist/
          cp -a gifts/. dist/gifts/
          python - <<'PY'
          from pathlib import Path
          import base64

          # Day 3: rebuild a normal JPEG file from its base64 text parts.
          p1 = Path('gifts/day3_photo_1.txt').read_text(encoding='utf-8')
          p2 = Path('gifts/day3_photo_2.txt').read_text(encoding='utf-8')
          data = base64.b64decode((p1+p2).replace('\n','').replace('\r','').replace(' ',''), validate=True)
          if not (data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')):
              raise SystemExit('Day 3 JPEG failed validation')
          Path('dist/gifts/day3_photo.jpg').write_bytes(data)

          # Day 4: rebuild the verified compact JPEG.
          b64 = Path('gifts/day4_photo_b64.txt').read_text(encoding='utf-8').replace('\n','').replace('\r','').replace(' ','')
          day4 = base64.b64decode(b64, validate=True)
          if not (day4.startswith(b'\xff\xd8') and day4.endswith(b'\xff\xd9')):
              raise SystemExit('Day 4 JPEG failed validation')
          if len(day4) != 6397:
              raise SystemExit(f'Day 4 JPEG unexpected size: {len(day4)}')
          Path('dist/gifts/day4_photo.jpg').write_bytes(day4)

          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const total = 12;', 'const total = 18;', 1)
          s = s.replace('const duration = 45 + Math.random() * 25;', 'const duration = 14 + Math.random() * 8;', 1)

          broken_pool = 'const FALLING_PHOTOS = [PARTY_FACE, EXTRA_FESTIVE_STICKER_1, EXTRA_FESTIVE_STICKER_2, EXTRA_NEW_STICKER_1, EXTRA_NEW_STICKER_2, EXTRA_NEW_STICKER_3, "party_anim_1.png", "party_anim_2.png", "party_anim_3.png", "new_party_anim_01.png", "new_party_anim_02.png", "new_party_anim_03.png", "new_party_anim_04.png", "new_party_anim_05.png", "new_party_anim_06.png", "new_party_anim_07.png", "new_party_anim_08.png", "new_party_anim_09.png", "new_party_anim_10.png"];'
          netlify_pool = 'const FALLING_PHOTOS = [PARTY_FACE, EXTRA_FESTIVE_STICKER_1, EXTRA_FESTIVE_STICKER_2, EXTRA_NEW_STICKER_1, EXTRA_NEW_STICKER_2, EXTRA_NEW_STICKER_3, EXTRA_PLAIN_STICKER_1, EXTRA_PLAIN_STICKER_2, EXTRA_PLAIN_STICKER_3, EXTRA_PARTY_ADDED_1, EXTRA_PARTY_ADDED_2, EXTRA_PARTY_ADDED_3, "new_anim_01.webp", "new_anim_02.webp", "new_anim_03.webp", "new_anim_04.webp", "new_anim_05.webp", "new_anim_06.webp", "new_anim_07.webp", "new_anim_08.webp", "new_anim_09.webp", "new_anim_10.webp", "new_anim_11.webp", "new_anim_12.webp", "new_anim_13.webp"];'
          if broken_pool not in s:
              raise SystemExit('Current animation pool not found')
          s = s.replace(broken_pool, netlify_pool, 1)

          loop_marker = '  for(let i = 0; i < total; i++){'
          if loop_marker not in s:
              raise SystemExit('Animation loop marker not found')
          s = s.replace(loop_marker, '  const animationOffset = Math.floor(Math.random() * FALLING_PHOTOS.length);\n\n  for(let i = 0; i < total; i++){', 1)
          random_choice = '    const chosen = FALLING_PHOTOS[Math.floor(Math.random() * FALLING_PHOTOS.length)];'
          if random_choice not in s:
              raise SystemExit('Animation choice marker not found')
          s = s.replace(random_choice, '    const chosen = FALLING_PHOTOS[(animationOffset + i) % FALLING_PHOTOS.length];', 1)

          old3 = '{date:"2026-08-26", day:"26", month:"AUG", gift:"Подарок №3", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"От человека №3"}'
          new3 = '{date:"2026-08-26", day:"26", month:"AUG", gift:"Подарок №3", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"Любимая жена", image:"gifts/day3_photo.jpg?v=9"}'
          if old3 in s:
              s = s.replace(old3, new3, 1)

          old4 = '{date:"2026-08-27", day:"27", month:"AUG", gift:"Подарок №4", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"От человека №4"}'
          new4 = '{date:"2026-08-27", day:"27", month:"AUG", gift:"Подарок №4", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"Любимая жена", image:"gifts/day4_photo.jpg?v=14"}'
          if old4 not in s:
              raise SystemExit('Day 4 placeholder not found')
          s = s.replace(old4, new4, 1)

          old5 = '{date:"2026-08-28", day:"28", month:"AUG", gift:"Подарок №5", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"От человека №5"}'
          new5 = '{date:"2026-08-28", day:"28", month:"AUG", gift:"Подарок №5", note:"Здесь потом будет описание подарка и подсказка, где его найти.", from:"Бабушка", image:"gifts/day5_photo.jpg?v=2"}'
          if old5 not in s:
              raise SystemExit('Day 5 placeholder not found')
          s = s.replace(old5, new5, 1)

          # Birthday surprise for the 28 August / gift 5 card.
          birthday_heading = '    <h3>Сегодняшний подарок — твой ✨</h3>'
          birthday_heading_new = '    <h3>${g.date === "2026-08-28" ? "С днём рождения! 🎉💖" : "Сегодняшний подарок — твой ✨"}</h3>'
          if birthday_heading not in s:
              raise SystemExit('Birthday heading marker not found')
          s = s.replace(birthday_heading, birthday_heading_new, 1)

          birthday_close = '  `);\n}\nfunction revealSender(){'
          birthday_close_new = '''  `);

  if(g.date === "2026-08-28"){
    const w = window.innerWidth;
    const h = window.innerHeight;
    setTimeout(() => burstConfetti(w * .22, h * .28), 80);
    setTimeout(() => burstConfetti(w * .50, h * .20), 160);
    setTimeout(() => burstConfetti(w * .78, h * .28), 240);
    setTimeout(() => burstConfetti(w * .35, h * .46), 380);
    setTimeout(() => burstConfetti(w * .65, h * .46), 520);
  }
}
function revealSender(){'''
          if birthday_close not in s:
              raise SystemExit('Birthday confetti marker not found')
          s = s.replace(birthday_close, birthday_close_new, 1)

          p.write_text(s, encoding='utf-8')

          if '"new_anim_13.webp"' not in s or 'EXTRA_PARTY_ADDED_3' not in s:
              raise SystemExit('Full Netlify animation pool verification failed')
          if 'FALLING_PHOTOS[(animationOffset + i) % FALLING_PHOTOS.length]' not in s:
              raise SystemExit('Unique animation selection patch failed')
          if 'from:"Любимая жена", image:"gifts/day4_photo.jpg?v=14"' not in s:
              raise SystemExit('Day 4 image patch verification failed')
          if 'from:"Бабушка", image:"gifts/day5_photo.jpg?v=2"' not in s:
              raise SystemExit('Day 5 image patch verification failed')
          if 'С днём рождения! 🎉💖' not in s or 'g.date === "2026-08-28"' not in s:
              raise SystemExit('Day 5 birthday surprise patch failed')
          day5 = Path('dist/gifts/day5_photo.jpg').read_bytes()
          if not (day5.startswith(b'\xff\xd8') and day5.endswith(b'\xff\xd9')):
              raise SystemExit('Day 5 JPEG failed validation')
          print(f'CURRENT_DEPLOY_OK: birthday surprise + confetti for day 5; day4={len(day4)} bytes; day5={len(day5)} bytes')
          PY
      - name: Publish current main to permanent ShipStatic address
        uses: shipstatic/action@v2
        with:
          token: ${{ secrets.SHIP_TOKEN }}
          path: ./dist
          domain: 30-podarkov-calendar.shipstatic.com
